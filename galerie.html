<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrong Way Customs | Galerie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gallery.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100" style="font-family: 'Inter', sans-serif;">

    <!-- Header -->
    <header class="bg-black/60 backdrop-blur sticky top-0 z-50">
      <div class="max-w-7xl mx-auto flex items-center justify-between p-4 flex-wrap md:flex-nowrap gap-3">

        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-3 flex-shrink-0">
          <img
            src="images/logo.png"
            alt="Wrong Way Customs Logo"
            class="h-8 object-contain"
          />
          <h1 class="text-xl font-semibold tracking-wide whitespace-nowrap">
            Wrong Way
          </h1>
        </a>

        <!-- Mobile Menu Button -->
        <button id="menuToggle" class="md:hidden text-white focus:outline-none">
          ☰
        </button>

        <!-- Navigation -->
        <nav
          id="navMenu"
          class="hidden w-full md:w-auto md:flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-6 text-sm uppercase font-medium tracking-wider transition-all duration-300 ease-in-out"
        >
          <a href="index.html" class="hover:text-lime-400 transition-colors">Home</a>
          <a href="team.html" class="hover:text-lime-400 transition-colors">Team</a>
          <a href="strecken.html" class="hover:text-lime-400 transition-colors">Strecken</a>
          <a href="galerie.html" class="text-lime-500">Galerie</a>
          <a href="kontakt.html" class="hover:text-lime-400 transition-colors">Kontakt</a>
        </nav>
      </div>
    </header>

    <!-- Menu Toggle Script -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.getElementById('menuToggle');
      const navMenu = document.getElementById('navMenu');
      menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('hidden');
      });
    });
    </script>

    <!-- Galerie -->
    <section id="galerie" class="max-w-7xl mx-auto py-20 px-4">
        <h2 class="text-3xl font-semibold mb-10">Galerie</h2>

        <section id="gallery">
          <div class="gallery-grid" id="galleryGrid"></div>
        </section>

        <script src="js/gallery.js" defer></script>
    </section>

  <!-- Footer -->
  <footer class="bg-black text-slate-500 text-sm text-center py-6">
    © 2026 Wrong Way
  </footer>

<!-- Lightbox Overlay -->
<div id="lightbox" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
    <button id="closeLightbox" class="absolute top-5 right-8 text-4xl text-white/70 hover:text-white transition-colors">&times;</button>

    <button id="prevBtn" class="absolute left-8 text-5xl text-white/70 hover:text-white transition-colors">&#10094;</button>
    <button id="nextBtn" class="absolute right-8 text-5xl text-white/70 hover:text-white transition-colors">&#10095;</button>

    <img id="lightboxImage" class="max-h-[90vh] max-w-[90vw] rounded-xl shadow-xl" />
</div>

</body>
</html>
